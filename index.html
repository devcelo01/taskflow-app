<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

    <div class="header">
        <h1>TaskFlow</h1>
        <p>Organize seu dia com clareza</p>
    </div>

    <div class="filters">
        <button onclick="filtrar('todas', event)">Todas</button>
        <button onclick="filtrar('pendentes')">Pendentes</button>
        <button onclick="filtrar('concluidas')">Concluídas</button>
    </div>
    <p id="contador"></p>
    <div class="input-container">
        <input type="text" id="taskInput" placeholder="Digite uma nova tarefa...">
        <button id="addTaskButton">Adicionar</button>
    </div>

    <ul id="taskList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
