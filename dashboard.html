<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">

        <aside class="sidebar">
            <h2>TaskFlow</h2>
            <button onclick="filtrar('todas', event)">📋 Todas</button>
            <button onclick="filtrar('pendentes', event)">⏳ Pendentes</button>
            <button onclick="filtrar('concluidas', event)">✅ Concluídas</button>

            <button id="clearCompleted">🧹 Limpar concluídas</button>
            <button id="logout">🚪 Sair</button>
        </aside>

        <main class="dashboard">
            <header>
                <h1 id="boasVindas">Bem-vindo</h1>
                <p id="contador"></p>
            </header>

            <div class="task-input">
                <input type="text" id="taskInput" placeholder="Digite uma nova tarefa...">
                <button id="addTask">Adicionar</button>
            </div>

            <ul id="taskList"></ul>
        </main>
    </div>

    <div id="toast"></div>
    <script src="script.js"></script>
</body>
</html>
